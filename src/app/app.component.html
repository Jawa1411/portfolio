<mat-sidenav-container class="shell">

  <!-- ── Sidenav ─────────────────────────────────────────────────────── -->
  <mat-sidenav #sidenav class="sidenav"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    [disableClose]="!isMobile">

    <!-- Profile block -->
    <div class="nav-profile">
      <div class="nav-avatar">JS</div>
      <div class="nav-name">Jawahar S</div>
      <div class="nav-role">Fullstack Developer</div>
    </div>

    <mat-divider class="nav-divider"></mat-divider>

    <!-- Nav items -->
    <nav class="nav-list">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-item"
          matRipple
          (click)="onNavClick()"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-indicator"></span>
        </a>
      }
    </nav>

    <div class="nav-spacer"></div>

    <!-- Theme toggle -->
    <div class="nav-footer">
      <button
        mat-icon-button
        (click)="toggleTheme()"
        [matTooltip]="isDark ? 'Light mode' : 'Dark mode'"
        class="theme-btn"
      >
        <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>

  </mat-sidenav>

  <!-- ── Main content ────────────────────────────────────────────────── -->
  <mat-sidenav-content class="main-content" (scroll)="onContentScroll($event)">

    <!-- Mobile top bar -->
    @if (isMobile) {
      <div class="mobile-toolbar">
        <button mat-icon-button class="menu-btn" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="mobile-title">Jawahar S</span>
        <button mat-icon-button class="theme-btn" (click)="toggleTheme()" [matTooltip]="isDark ? 'Light mode' : 'Dark mode'">
          <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    }

    <!-- Scroll progress bar -->
    <div class="scroll-bar" [style.width.%]="scrollPct"></div>

    <!-- Routed pages -->
    <div [@routeFade]="prepareRoute(outlet)" class="route-wrapper">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
